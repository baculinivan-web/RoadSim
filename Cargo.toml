[workspace]
members = [
    "crates/roadsim-app",
    "crates/roadsim-backend-api",
    "crates/roadsim-backend-fake",
    "crates/roadsim-backend-sumo",
    "crates/roadsim-cli",
    "crates/roadsim-commands",
    "crates/roadsim-compiled-network",
    "crates/roadsim-compiler",
    "crates/roadsim-domain",
    "crates/roadsim-types",
    "crates/roadsim-worker-client",
    "crates/roadsim-worker-protocol",
    "workers/roadsim-sumo-worker",
    "workers/roadsim-worker-stub",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
egui = "0.33.3"
egui-wgpu = { version = "0.33.3", features = ["winit", "x11"] }
egui-winit = { version = "0.33.3", default-features = false, features = ["x11"] }
libm = "0.2.16"
libloading = "0.8.9"
pollster = "0.4.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
uuid = { version = "1.24.0", features = ["serde"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
