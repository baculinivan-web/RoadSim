schema_version = 1
diagnostic_code = "ARCH-FORBIDDEN-DEPENDENCY"

[[rules]]
id = "domain-is-independent"
from = ["roadsim-domain"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-cli",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "roadsim-storage",
    "sumo-worker",
    "tokio",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4: domain must not depend on UI, GPU, SUMO, filesystem, or an async runtime"

[[rules]]
id = "compiled-network-is-backend-independent"
from = ["roadsim-compiled-network"]
to = [
    "libsumo",
    "roadsim-backend-sumo",
    "roadsim-commands",
    "roadsim-domain",
    "roadsim-editor-ui",
    "sumo-worker",
]
rationale = "ARCHITECTURE §4: compiled-network must not depend on mutable Design Model types or a backend implementation"

[[rules]]
id = "geometry-is-derived-core-only"
from = ["roadsim-geometry"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-commands",
    "roadsim-compiled-network",
    "roadsim-compiler",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "roadsim-storage",
    "sumo-worker",
    "tokio",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§7.3 and ADR-021: derived geometry may depend on Design contracts and core math, never UI, GPU, backend, storage, commands, or higher compiler layers"

[[rules]]
id = "compiler-is-ui-and-backend-independent"
from = ["roadsim-compiler"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§8: compiler transforms an immutable Design snapshot into backend-independent CSN without UI or backend implementation dependencies"

[[rules]]
id = "sumo-client-is-ui-and-domain-independent"
from = ["roadsim-backend-sumo-client"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-commands",
    "roadsim-domain",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4: the SUMO backend client binds the backend contract to the worker IPC boundary and must not depend on the desktop UI or the mutable Design Model"

[[rules]]
id = "application-is-ui-and-backend-implementation-independent"
from = ["roadsim-application"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4: run orchestration is an application service over the backend contract and must not depend on the desktop UI, GPU, or a production backend implementation; the in-memory test double of ARCHITECTURE §10 stays allowed because this guard does not distinguish dev-dependencies"

[[rules]]
id = "backend-api-is-ui-independent"
from = ["roadsim-backend-api"]
to = [
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-cli",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
]
rationale = "ARCHITECTURE §4: backend-api is a versioned contract and must not depend on desktop UI or an implementation"

[[rules]]
id = "fake-backend-is-ui-and-sumo-independent"
from = ["roadsim-backend-fake"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §10: the in-memory contract test double must remain deterministic and independent of UI and SUMO implementation details"

[[rules]]
id = "sumo-backend-is-ui-and-domain-independent"
from = ["roadsim-backend-sumo"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-commands",
    "roadsim-domain",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§10: SUMO adapter consumes immutable CSN contracts and must not depend on UI, mutable Design Model, or in-process libsumo"

[[rules]]
id = "renderer-does-not-own-domain"
from = ["roadsim-renderer"]
to = ["roadsim-commands", "roadsim-domain"]
rationale = "ARCHITECTURE §4: renderer consumes read-only render snapshots rather than the mutable Design Model"

[[rules]]
id = "worker-protocol-is-wire-only"
from = ["roadsim-worker-protocol"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-domain",
    "roadsim-renderer",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§11: worker wire DTO and framing must not depend on UI, mutable Design Model, or a backend implementation"

[[rules]]
id = "worker-client-is-ui-and-engine-independent"
from = ["roadsim-worker-client"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-domain",
    "roadsim-renderer",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§11: generic worker lifecycle client exposes no UI, domain, libsumo, or engine implementation types"
