schema_version = 1
diagnostic_code = "ARCH-FORBIDDEN-DEPENDENCY"

[[rules]]
id = "domain-is-independent"
from = ["roadsim-domain"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-cli",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "roadsim-storage",
    "sumo-worker",
    "tokio",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4: domain must not depend on UI, GPU, SUMO, filesystem, or an async runtime"

[[rules]]
id = "compiled-network-is-backend-independent"
from = ["roadsim-compiled-network"]
to = [
    "libsumo",
    "roadsim-backend-sumo",
    "roadsim-commands",
    "roadsim-domain",
    "roadsim-editor-ui",
    "sumo-worker",
]
rationale = "ARCHITECTURE §4: compiled-network must not depend on mutable Design Model types or a backend implementation"

[[rules]]
id = "compiler-is-ui-and-backend-independent"
from = ["roadsim-compiler"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§8: compiler transforms an immutable Design snapshot into backend-independent CSN without UI or backend implementation dependencies"

[[rules]]
id = "backend-api-is-ui-independent"
from = ["roadsim-backend-api"]
to = [
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-cli",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
]
rationale = "ARCHITECTURE §4: backend-api is a versioned contract and must not depend on desktop UI or an implementation"

[[rules]]
id = "fake-backend-is-ui-and-sumo-independent"
from = ["roadsim-backend-fake"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-editor-ui",
    "roadsim-renderer",
    "sumo-worker",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §10: the in-memory contract test double must remain deterministic and independent of UI and SUMO implementation details"

[[rules]]
id = "renderer-does-not-own-domain"
from = ["roadsim-renderer"]
to = ["roadsim-commands", "roadsim-domain"]
rationale = "ARCHITECTURE §4: renderer consumes read-only render snapshots rather than the mutable Design Model"

[[rules]]
id = "worker-protocol-is-wire-only"
from = ["roadsim-worker-protocol"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-*",
    "roadsim-domain",
    "roadsim-renderer",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§11: worker wire DTO and framing must not depend on UI, mutable Design Model, or a backend implementation"

[[rules]]
id = "worker-client-is-ui-and-engine-independent"
from = ["roadsim-worker-client"]
to = [
    "egui",
    "libsumo",
    "roadsim-app",
    "roadsim-backend-sumo",
    "roadsim-domain",
    "roadsim-renderer",
    "wgpu",
    "winit",
]
rationale = "ARCHITECTURE §4/§11: generic worker lifecycle client exposes no UI, domain, libsumo, or engine implementation types"
